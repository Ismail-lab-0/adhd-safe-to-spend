/* Design tokens — the single source of truth for color, type, space, radius,
   elevation and motion. Components reference tokens only; no raw hex values
   outside this file. Rationale and usage rules: docs/DESIGN.md.

   Palette: warm terracotta + plum on warm paper, deliberately away from the
   teal/green "calm fintech" look most competitors use (spec.md → Design).
   Contrast pairs required by validators/app_check.py are verified ≥ 4.5:1 in
   both themes; tests/unit/design.test.js re-checks every text pair below. */
:root {
  color-scheme: light;

  /* Surfaces */
  --color-bg: #FBF6F1;
  --color-card: #FFFFFF;
  --color-sunken: #F4ECE3;
  --color-border: #E8DCCF;
  --color-border-strong: #D5C4B3;

  /* Text */
  --color-ink: #2D2729;
  --color-muted: #6E6259;
  --color-faint: #8F8278;

  /* Brand */
  --color-accent: #D9714E;          /* decorative: icons, bars, highlights */
  --color-accent-soft: #FBE7DD;
  --color-plum: #7E4F70;
  --color-plum-soft: #F1E4EC;

  /* Solid fills carrying white text — FIXED across themes (see docs/DESIGN.md) */
  --color-primary: #A34B2A;
  --color-primary-hover: #8C3F22;
  --color-on-primary: #FFFFFF;
  --color-danger-strong: #A8353F;
  --color-on-danger: #FFFFFF;

  /* Semantic */
  --color-danger: #A8353F;
  --color-error-bg: #F9E4E5;
  --color-success: #2C6A4B;
  --color-success-bg: #E2F0E7;
  --color-warning: #85570A;
  --color-warning-bg: #FBF0D8;
  --color-info: #2C5B85;
  --color-info-bg: #E4EDF5;

  /* Breakdown categories (always paired with a text label, never color alone) */
  --color-cat-bills: #D9714E;
  --color-cat-setaside: #C99A3E;
  --color-cat-savings: #8A5C7A;
  --color-cat-safe: #2F7A55;

  /* Overlays */
  --color-toast-bg: #2D2729;
  --color-toast-ink: #FBF6F1;
  --color-toast-action: #F4B79E;
  --color-scrim: rgba(30, 20, 25, .45);

  /* Space (4px base) */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;

  /* Radius */
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-full: 999px;

  /* Elevation */
  --shadow-sm: 0 1px 2px rgba(60, 40, 30, .06), 0 1px 1px rgba(60, 40, 30, .04);
  --shadow-md: 0 6px 20px rgba(60, 40, 30, .10);
  --shadow-lg: 0 18px 48px rgba(40, 25, 20, .22);

  /* Type */
  --font-body: "Nunito Sans", ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-heading: "Quicksand", ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-lg: 1.125rem;
  --text-xl: 1.375rem;
  --text-2xl: 1.75rem;
  --text-hero: clamp(2.75rem, 11vw, 4rem);
  --leading-tight: 1.2;
  --leading-normal: 1.5;
  --weight-regular: 400;
  --weight-semibold: 600;
  --weight-bold: 700;

  /* Layout */
  --tap: 44px;
  --content-max: 1120px;
  --sidebar-w: 236px;
  --tabbar-h: 64px;

  /* Motion */
  --ease: cubic-bezier(.2, .7, .2, 1);
  --dur-fast: 120ms;
  --dur: 200ms;
}

/* Dark theme: explicit choice, or "system" (no data-theme) on a dark OS. */
:root[data-theme="dark"] {
  color-scheme: dark;
  --color-bg: #1D161C;
  --color-card: #281F27;
  --color-sunken: #221A21;
  --color-border: #3E313B;
  --color-border-strong: #54434F;
  --color-ink: #F2ECE6;
  --color-muted: #BDAFB7;
  --color-faint: #9C8E97;
  --color-accent: #E8906F;
  --color-accent-soft: #3D2620;
  --color-plum: #D3A3C4;
  --color-plum-soft: #3A2734;
  --color-danger: #F0959B;
  --color-error-bg: #3D2023;
  --color-success: #8ED0AA;
  --color-success-bg: #1C3529;
  --color-warning: #EBC56E;
  --color-warning-bg: #3A2F14;
  --color-info: #93C0E8;
  --color-info-bg: #1C3044;
  --color-cat-bills: #E8906F;
  --color-cat-setaside: #D9B15F;
  --color-cat-savings: #C08BB2;
  --color-cat-safe: #63B98B;
  --color-toast-bg: #F2ECE6;
  --color-toast-ink: #2D2729;
  --color-toast-action: #A34B2A;
  --color-scrim: rgba(0, 0, 0, .6);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, .35);
  --shadow-lg: 0 18px 48px rgba(0, 0, 0, .55);
}


/* Base element styles and typography. */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: var(--leading-normal);
  background: var(--color-bg);
  color: var(--color-ink);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3 {
  font-family: var(--font-heading);
  font-weight: var(--weight-bold);
  line-height: var(--leading-tight);
  letter-spacing: -0.01em;
  margin: 0;
}
h1 { font-size: var(--text-2xl); }
h2 { font-size: var(--text-lg); }
h3 { font-size: var(--text-base); }
p { margin: 0; }
a { color: var(--color-primary); }
:root[data-theme="dark"] a { color: var(--color-accent); }
svg { flex-shrink: 0; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--color-muted); }
.text-sm { font-size: var(--text-sm); }
.text-xs { font-size: var(--text-xs); }
.visually-hidden {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
:focus-visible { outline: 3px solid var(--color-accent); outline-offset: 2px; border-radius: 6px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}


/* Reusable components. Every view is composed from these — see docs/DESIGN.md
   for when to use which. */

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  min-height: var(--tap); padding: 0 var(--space-4);
  font: inherit; font-weight: var(--weight-semibold); font-size: var(--text-base);
  border-radius: var(--radius-sm); border: 1px solid transparent;
  cursor: pointer; white-space: nowrap; text-decoration: none;
  transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--color-primary); color: var(--color-on-primary); }
.btn-primary:hover:not(:disabled) { background: var(--color-primary-hover); }
.btn-secondary { background: var(--color-card); color: var(--color-ink); border-color: var(--color-border-strong); }
.btn-secondary:hover:not(:disabled) { background: var(--color-sunken); }
.btn-ghost { background: transparent; color: var(--color-ink); }
.btn-ghost:hover:not(:disabled) { background: var(--color-sunken); }
.btn-danger { background: var(--color-danger-strong); color: var(--color-on-danger); }
.btn-danger-quiet { background: transparent; color: var(--color-danger); border-color: var(--color-border-strong); }
.btn-danger-quiet:hover { background: var(--color-error-bg); }
.btn-sm { min-height: 40px; padding: 0 var(--space-3); font-size: var(--text-sm); }
.btn-block { width: 100%; }
.icon-btn {
  display: inline-grid; place-items: center; width: var(--tap); height: var(--tap);
  border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--color-muted);
  cursor: pointer;
}
.icon-btn:hover { background: var(--color-sunken); color: var(--color-ink); }
.icon-btn svg, .btn svg { width: 20px; height: 20px; }
.link-btn {
  background: none; border: 0; padding: var(--space-2) 0; min-height: var(--tap);
  font: inherit; font-weight: var(--weight-semibold); color: var(--color-primary); cursor: pointer;
  display: inline-flex; align-items: center; gap: var(--space-1);
}
:root[data-theme="dark"] .link-btn { color: var(--color-accent); }

/* ---------- Cards ---------- */
.card {
  background: var(--color-card);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-5);
  box-shadow: var(--shadow-sm);
  min-width: 0;
}
.card-header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-4); }
.card-header h2 { display: flex; align-items: center; gap: var(--space-2); }
.card-header .hint { font-size: var(--text-sm); color: var(--color-muted); }
.card-flush { padding: 0; overflow: hidden; }
.card-flush > .card-header { padding: var(--space-5) var(--space-5) 0; }

/* ---------- Forms ---------- */
.form { display: grid; gap: var(--space-4); }
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-3); }
.field { display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 6px; min-width: 0; }
.field > label, .field-label { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--color-ink); }
.field .optional { font-weight: var(--weight-regular); color: var(--color-muted); }
.input, .select {
  width: 100%; min-height: var(--tap); padding: 0 var(--space-3);
  font: inherit; color: var(--color-ink); background: var(--color-card);
  border: 1px solid var(--color-border-strong); border-radius: var(--radius-sm);
  transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.input { min-width: 0; }
.input[type="date"] { display: block; }
.input::placeholder { color: var(--color-faint); }
.input:focus, .select:focus { outline: none; border-color: var(--color-accent); box-shadow: 0 0 0 3px var(--color-accent-soft); }
.select {
  appearance: none; -webkit-appearance: none; padding-right: 40px;
  background-image: linear-gradient(45deg, transparent 50%, var(--color-muted) 50%), linear-gradient(135deg, var(--color-muted) 50%, transparent 50%);
  background-position: calc(100% - 20px) 50%, calc(100% - 15px) 50%;
  background-size: 5px 5px; background-repeat: no-repeat;
}
.input-money { position: relative; }
.input-money .prefix {
  position: absolute; left: var(--space-3); top: 50%; transform: translateY(-50%);
  color: var(--color-muted); pointer-events: none; font-variant-numeric: tabular-nums;
}
.input-money .input { padding-left: calc(var(--space-3) + var(--prefix-w, 1ch) + 6px); font-variant-numeric: tabular-nums; }
.field .help { font-size: var(--text-sm); color: var(--color-muted); }
.field-error { display: none; font-size: var(--text-sm); color: var(--color-danger); font-weight: var(--weight-semibold); }
.field.has-error .input, .field.has-error .select { border-color: var(--color-danger); }
.field.has-error .field-error { display: block; }
.check { display: flex; align-items: flex-start; gap: var(--space-3); min-height: var(--tap); cursor: pointer; padding: var(--space-2) 0; }
.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--color-primary); flex-shrink: 0; }
.check span small { display: block; color: var(--color-muted); font-size: var(--text-sm); }
.form-actions { display: flex; gap: var(--space-3); flex-wrap: wrap; }
.form-error {
  padding: var(--space-3) var(--space-4); border-radius: var(--radius-sm);
  background: var(--color-error-bg); color: var(--color-danger); font-size: var(--text-sm); font-weight: var(--weight-semibold);
}

/* Segmented control (radio group) */
.segmented {
  display: inline-flex; padding: 4px; gap: 4px; border-radius: var(--radius-sm);
  background: var(--color-sunken); border: 1px solid var(--color-border); max-width: 100%; min-width: 0;
}
.segmented label { position: relative; flex: 1 1 0; min-width: 0; }
.segmented input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.segmented span {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; padding: 0 var(--space-3); border-radius: 7px;
  font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--color-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.segmented input:checked + span { background: var(--color-card); color: var(--color-ink); box-shadow: var(--shadow-sm); }
.segmented input:focus-visible + span { outline: 3px solid var(--color-accent); outline-offset: 1px; }
.segmented.full { display: flex; width: 100%; }

/* ---------- Lists ---------- */
.list { list-style: none; margin: 0; padding: 0; }
.list-item {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-3) 0; border-top: 1px solid var(--color-border); min-height: 60px;
}
.list-item:first-child { border-top: 0; }
.card-flush .list-item { padding-left: var(--space-5); padding-right: var(--space-3); }
.list-main { flex: 1; min-width: 0; }
.list-title { font-weight: var(--weight-semibold); overflow-wrap: anywhere; }
.list-meta { font-size: var(--text-sm); color: var(--color-muted); display: flex; flex-wrap: wrap; gap: 2px var(--space-2); align-items: center; }
.list-amount { font-weight: var(--weight-bold); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.list-actions { display: flex; align-items: center; gap: var(--space-1); }
.date-chip {
  display: grid; place-items: center; width: 46px; height: 50px; flex-shrink: 0;
  border-radius: var(--radius-sm); background: var(--color-sunken); line-height: 1.05;
}
.date-chip .m { font-size: 11px; font-weight: var(--weight-bold); text-transform: uppercase; color: var(--color-muted); letter-spacing: .04em; }
.date-chip .d { font-family: var(--font-heading); font-size: var(--text-lg); font-weight: var(--weight-bold); }
.date-chip.overdue { background: var(--color-error-bg); }
.date-chip.overdue .m, .date-chip.overdue .d { color: var(--color-danger); }

/* Pills / status */
.pill {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: var(--radius-full);
  font-size: var(--text-xs); font-weight: var(--weight-bold); line-height: 1.5; white-space: nowrap;
  background: var(--color-sunken); color: var(--color-muted);
}
.pill svg { width: 12px; height: 12px; }
.pill-danger { background: var(--color-error-bg); color: var(--color-danger); }
.pill-warning { background: var(--color-warning-bg); color: var(--color-warning); }
.pill-success { background: var(--color-success-bg); color: var(--color-success); }
.pill-info { background: var(--color-info-bg); color: var(--color-info); }
.pill-plum { background: var(--color-plum-soft); color: var(--color-plum); }

/* Paid toggle */
.paid-toggle {
  display: inline-flex; align-items: center; gap: 6px; min-height: var(--tap); min-width: var(--tap);
  padding: 0 var(--space-3); border-radius: var(--radius-full);
  border: 1.5px solid var(--color-border-strong); background: var(--color-card); color: var(--color-ink);
  font: inherit; font-size: var(--text-sm); font-weight: var(--weight-bold); cursor: pointer;
}
.paid-toggle svg { width: 16px; height: 16px; }
.paid-toggle:hover { border-color: var(--color-success); color: var(--color-success); }
.paid-toggle[aria-pressed="true"] { background: var(--color-success-bg); border-color: transparent; color: var(--color-success); }

/* ---------- Progress ---------- */
.progress { height: 10px; border-radius: var(--radius-full); background: var(--color-sunken); overflow: hidden; }
.progress > span { display: block; height: 100%; border-radius: inherit; background: var(--color-cat-savings); transition: width var(--dur) var(--ease); }
.progress.done > span { background: var(--color-cat-safe); }

/* ---------- Stats ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: var(--space-3); }
.stat { padding: var(--space-4); border-radius: var(--radius-md); background: var(--color-card); border: 1px solid var(--color-border); }
.stat-label { font-size: var(--text-sm); color: var(--color-muted); font-weight: var(--weight-semibold); }
.stat-value { font-family: var(--font-heading); font-size: var(--text-xl); font-weight: var(--weight-bold); font-variant-numeric: tabular-nums; margin-top: 2px; }

/* ---------- Empty state ---------- */
.empty { display: grid; justify-items: center; text-align: center; gap: var(--space-2); padding: var(--space-6) var(--space-4); color: var(--color-muted); }
.empty-icon { display: grid; place-items: center; width: 56px; height: 56px; border-radius: var(--radius-full); background: var(--color-accent-soft); color: var(--color-accent); margin-bottom: var(--space-1); }
.empty-icon svg { width: 26px; height: 26px; }
.empty strong { color: var(--color-ink); font-size: var(--text-base); }
.empty p { max-width: 34ch; font-size: var(--text-sm); }

/* ---------- Banners ---------- */
.banner {
  display: flex; gap: var(--space-3); align-items: flex-start;
  padding: var(--space-3) var(--space-4); border-radius: var(--radius-sm); font-size: var(--text-sm);
}
.banner svg { width: 18px; height: 18px; margin-top: 2px; }
.banner > div { flex: 1; min-width: 0; }
.banner strong { display: block; }
.banner.info { background: var(--color-info-bg); color: var(--color-info); }
.banner.warning { background: var(--color-warning-bg); color: var(--color-warning); }
.banner.error { background: var(--color-error-bg); color: var(--color-danger); }
.banner.success { background: var(--color-success-bg); color: var(--color-success); }
.banner .link-btn { color: inherit; text-decoration: underline; min-height: 0; padding: 0; }

/* ---------- Dialog ---------- */
dialog.modal {
  width: min(480px, calc(100vw - 32px)); max-height: calc(100dvh - 32px);
  padding: 0; border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  background: var(--color-card); color: var(--color-ink); box-shadow: var(--shadow-lg);
}
dialog.modal::backdrop { background: var(--color-scrim); }
.modal-header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-4) var(--space-4) 0 var(--space-5); }
.modal-header h2 { font-size: var(--text-xl); }
.modal-body { padding: var(--space-4) var(--space-5) var(--space-5); display: grid; gap: var(--space-4); }
.modal-body > p { color: var(--color-muted); }
.modal-footer > .btn-danger-quiet { margin-right: auto; }
.modal-footer { display: flex; justify-content: flex-end; gap: var(--space-3); flex-wrap: wrap; padding: var(--space-4) var(--space-5); border-top: 1px solid var(--color-border); background: var(--color-sunken); }
@media (max-width: 520px) {
  dialog.modal { margin: auto auto 0; width: 100vw; max-width: 100vw; border-radius: var(--radius-lg) var(--radius-lg) 0 0; border-bottom: 0; }
  .modal-footer { padding-bottom: calc(var(--space-4) + env(safe-area-inset-bottom)); }
  .modal-footer .btn { flex: 1; }
}

/* ---------- Toast ---------- */
.toast-region { position: fixed; left: 50%; transform: translateX(-50%); bottom: var(--space-5); z-index: 50; display: grid; gap: var(--space-2); width: min(440px, calc(100vw - 32px)); pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: var(--space-3); pointer-events: auto;
  padding: var(--space-2) var(--space-2) var(--space-2) var(--space-4); min-height: 52px;
  border-radius: var(--radius-md); background: var(--color-toast-bg); color: var(--color-toast-ink); box-shadow: var(--shadow-lg);
  font-size: var(--text-sm); font-weight: var(--weight-semibold);
  animation: toast-in var(--dur) var(--ease);
}
.toast span { flex: 1; }
.toast button { min-height: 40px; padding: 0 var(--space-3); border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--color-toast-action); font: inherit; font-weight: var(--weight-bold); cursor: pointer; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- Disclosure ---------- */
details.disclosure > summary {
  list-style: none; cursor: pointer; display: flex; align-items: center; gap: var(--space-2);
  min-height: var(--tap); font-weight: var(--weight-semibold); color: var(--color-primary);
}
:root[data-theme="dark"] details.disclosure > summary { color: var(--color-accent); }
details.disclosure > summary::-webkit-details-marker { display: none; }
details.disclosure > summary svg { width: 18px; height: 18px; transition: transform var(--dur) var(--ease); }
details.disclosure[open] > summary svg { transform: rotate(90deg); }


/* App shell. Two layouts, one breakpoint:
   - < 760px (phones): compact top bar + fixed bottom tab bar (thumb reach).
   - ≥ 760px (tablet/desktop): persistent left sidebar.
   Content is width-capped so lines and the number never stretch across a wide
   monitor. */
.shell { min-height: 100vh; min-height: 100dvh; }

/* Sidebar / tab bar share #view-nav (validators/app_check.py clicks [data-nav]). */
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: var(--sidebar-w); z-index: 20;
  display: flex; flex-direction: column; gap: var(--space-5);
  padding: var(--space-5) var(--space-4);
  background: var(--color-card); border-right: 1px solid var(--color-border);
}
.brand { display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-2); }
.brand-mark { width: 36px; height: 36px; flex-shrink: 0; }
.brand-name { font-family: var(--font-heading); font-weight: var(--weight-bold); font-size: var(--text-base); line-height: 1.15; }
.brand-name small { display: block; font-family: var(--font-body); font-weight: var(--weight-regular); font-size: var(--text-xs); color: var(--color-muted); }

#view-nav { display: flex; flex-direction: column; gap: 2px; }
#view-nav button {
  display: flex; align-items: center; gap: var(--space-3);
  min-height: var(--tap); padding: 0 var(--space-3);
  border: 0; border-radius: var(--radius-sm); background: transparent;
  font: inherit; font-weight: var(--weight-semibold); color: var(--color-muted); text-align: left; cursor: pointer;
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
#view-nav button svg { width: 22px; height: 22px; }
#view-nav button:hover { background: var(--color-sunken); color: var(--color-ink); }
#view-nav button[aria-current="page"] { background: var(--color-accent-soft); color: var(--color-primary); }
:root[data-theme="dark"] #view-nav button[aria-current="page"] { color: var(--color-accent); }
#view-nav .badge {
  margin-left: auto; min-width: 22px; height: 22px; padding: 0 6px; border-radius: var(--radius-full);
  display: inline-grid; place-items: center; font-size: var(--text-xs); font-weight: var(--weight-bold);
  background: var(--color-danger-strong); color: var(--color-on-danger);
}

.sidebar-foot { margin-top: auto; display: grid; gap: var(--space-3); font-size: var(--text-xs); color: var(--color-muted); padding: 0 var(--space-2); }
.sidebar-foot .privacy { display: flex; gap: var(--space-2); align-items: flex-start; }
.sidebar-foot svg { width: 16px; height: 16px; margin-top: 1px; }

.main { margin-left: var(--sidebar-w); min-width: 0; }
#view-root {
  max-width: var(--content-max); margin: 0 auto;
  padding: var(--space-6) var(--space-6) var(--space-7);
}
#view-root:focus { outline: none; }

.topbar { display: none; }

.demo-banner {
  display: flex; align-items: center; justify-content: center; gap: var(--space-2); flex-wrap: wrap;
  padding: var(--space-2) var(--space-4); text-align: center;
  background: var(--color-plum-soft); color: var(--color-plum); font-size: var(--text-sm); font-weight: var(--weight-semibold);
}

/* Page header inside a view */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; margin-bottom: var(--space-5); }
.page-head p { color: var(--color-muted); margin-top: var(--space-1); max-width: 60ch; }
.stack { display: grid; gap: var(--space-4); align-content: start; min-width: 0; }
.cols { display: grid; gap: var(--space-4); grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 1100px) {
  .cols { grid-template-columns: minmax(0, 1.45fr) minmax(320px, 1fr); gap: var(--space-5); }
  .cols.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
}

/* ---------- Phone ---------- */
@media (max-width: 759px) {
  .sidebar {
    inset: auto 0 0 0; width: auto; height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
    flex-direction: row; padding: 0 var(--space-1) env(safe-area-inset-bottom); gap: 0;
    border-right: 0; border-top: 1px solid var(--color-border);
    box-shadow: 0 -4px 16px rgba(60, 40, 30, .06);
  }
  .sidebar .brand, .sidebar-foot { display: none; }
  #view-nav { flex-direction: row; flex: 1; gap: 0; }
  #view-nav button {
    flex: 1; flex-direction: column; justify-content: center; gap: 2px;
    min-height: var(--tabbar-h); padding: 6px 0 4px; border-radius: 0;
    font-size: 11px; text-align: center; position: relative; min-width: 0;
  }
  #view-nav button span.label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  #view-nav button[aria-current="page"] { background: transparent; }
  #view-nav button[aria-current="page"]::before {
    content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px;
    border-radius: 0 0 3px 3px; background: var(--color-primary);
  }
  :root[data-theme="dark"] #view-nav button[aria-current="page"]::before { background: var(--color-accent); }
  #view-nav .badge { position: absolute; top: 6px; left: calc(50% + 6px); margin: 0; min-width: 18px; height: 18px; font-size: 10px; padding: 0 4px; }

  .main { margin-left: 0; padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom)); }
  .topbar {
    display: flex; align-items: center; gap: var(--space-3);
    padding: var(--space-3) var(--space-4); padding-top: calc(var(--space-3) + env(safe-area-inset-top));
    background: var(--color-bg);
  }
  .topbar .brand { padding: 0; }
  .topbar .brand-mark { width: 30px; height: 30px; }
  #view-root { padding: var(--space-2) var(--space-4) var(--space-6); }
  .page-head { margin-bottom: var(--space-4); }
  .card:not(.card-flush) { padding: var(--space-4); }
  .card-flush > .card-header { padding: var(--space-4) var(--space-4) 0; }
  .card-flush .list-item { padding-left: var(--space-4); }
  .toast-region { bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + var(--space-3)); }
}


/* Today view. */

/* Desktop: two columns (number + what's due | quick log + recent).
   Phone/tablet: one column, re-ordered so the quick log sits right under the
   number — the two things used every day — via display:contents + order. */
.today-grid { display: grid; gap: var(--space-4); grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 1100px) {
  .today-grid { grid-template-columns: minmax(0, 1.5fr) minmax(320px, 1fr); gap: var(--space-5); }
}
@media (max-width: 1099px) {
  .today-grid > .stack { display: contents; }
  .o-alert { order: 1; } .o-onboarding { order: 2; } .o-hero { order: 3; }
  .o-quick { order: 4; } .o-due { order: 5; } .o-activity { order: 6; }
}

/* ---------- Hero ---------- */
.hero {
  position: relative; overflow: hidden;
  display: grid; gap: var(--space-2);
  padding: var(--space-6);
  background:
    radial-gradient(120% 90% at 100% 0%, var(--color-accent-soft) 0%, transparent 60%),
    var(--color-card);
}
.hero-eyebrow { font-size: var(--text-sm); font-weight: var(--weight-bold); letter-spacing: .06em; text-transform: uppercase; color: var(--color-muted); }
.hero-number {
  font-family: var(--font-heading); font-weight: var(--weight-bold);
  font-size: var(--text-hero); line-height: 1; letter-spacing: -0.02em;
  color: var(--color-cat-safe); margin: var(--space-1) 0;
  overflow-wrap: anywhere;
}
.hero.is-negative .hero-number { color: var(--color-danger); }
.hero.is-negative { background: radial-gradient(120% 90% at 100% 0%, var(--color-error-bg) 0%, transparent 60%), var(--color-card); }
.hero-sub { font-size: var(--text-lg); color: var(--color-ink); max-width: 46ch; }
.hero-empty .hero-number { color: var(--color-border-strong); }
.hero-empty .hero-sub { color: var(--color-muted); font-size: var(--text-base); }
.hero-empty > div { margin-top: var(--space-2); }

.hero-meta { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); margin-top: var(--space-3); }
.meta-btn {
  display: grid; grid-template-columns: auto 1fr; column-gap: var(--space-3); align-items: center; text-align: left;
  min-height: 60px; padding: var(--space-3); border-radius: var(--radius-md);
  border: 1px solid var(--color-border); background: var(--color-bg); color: var(--color-ink);
  font: inherit; cursor: pointer; transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.meta-btn:hover { border-color: var(--color-border-strong); background: var(--color-sunken); }
.meta-btn > .icon { grid-row: span 2; color: var(--color-accent); }
.meta-btn > .icon svg { width: 22px; height: 22px; }
.meta-label { display: block; font-size: var(--text-xs); font-weight: var(--weight-bold); color: var(--color-muted); text-transform: uppercase; letter-spacing: .05em; }
.meta-value { display: block; font-weight: var(--weight-bold); }
.meta-sub { grid-column: 2; font-size: var(--text-xs); color: var(--color-muted); }

/* ---------- Breakdown ---------- */
.breakdown { margin-top: var(--space-2); border-top: 1px solid var(--color-border); padding-top: var(--space-1); }
.bar { display: flex; gap: 3px; height: 14px; margin: var(--space-2) 0 var(--space-3); }
.bar .seg { display: block; min-width: 6px; border-radius: 4px; }
.seg-bills { background: var(--color-cat-bills); }
.seg-setaside { background: var(--color-cat-setaside); }
.seg-savings { background: var(--color-cat-savings); }
.seg-safe { background: var(--color-cat-safe); }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; margin-top: 6px; }
.swatch-balance { background: transparent; border: 2px solid var(--color-muted); }
.equation { margin: 0; display: grid; }
.eq-row { display: flex; justify-content: space-between; gap: var(--space-4); padding: 6px 0; font-size: var(--text-sm); }
.eq-row dt { display: flex; gap: var(--space-2); align-items: flex-start; color: var(--color-ink); min-width: 0; }
.eq-row dt small { display: block; color: var(--color-muted); font-size: var(--text-xs); overflow-wrap: anywhere; }
.eq-row dd { margin: 0; font-weight: var(--weight-semibold); white-space: nowrap; }
.eq-total { border-top: 1px solid var(--color-border); margin-top: var(--space-1); padding-top: var(--space-2); font-size: var(--text-base); }
.eq-total dt, .eq-total dd { font-weight: var(--weight-bold); }

/* ---------- Onboarding ---------- */
.onboarding { border-color: var(--color-accent); border-width: 1.5px; }
.onboarding .card-header { align-items: flex-start; margin-bottom: var(--space-3); }
.onboarding h2 .icon { color: var(--color-accent); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-1); }
.steps li { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) 0; }
.step-num {
  display: grid; place-items: center; width: 32px; height: 32px; flex-shrink: 0; border-radius: var(--radius-full);
  background: var(--color-sunken); font-weight: var(--weight-bold); font-size: var(--text-sm); color: var(--color-muted);
}
.steps li.done .step-num { background: var(--color-success-bg); color: var(--color-success); }
.steps li.done .step-num svg { width: 16px; height: 16px; }
.steps li.done .list-title { color: var(--color-muted); text-decoration: line-through; text-decoration-color: var(--color-border-strong); }
.ob-sample { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; margin-top: var(--space-2); padding-top: var(--space-3); border-top: 1px dashed var(--color-border); }

/* ---------- Quick log ---------- */
.quick-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: var(--space-3); }
.quick-row .input-money .input { font-size: var(--text-lg); font-weight: var(--weight-bold); }
#quickLogForm .segmented { display: flex; }

/* ---------- Lists on Today ---------- */
.paid-spacer { width: 0; }
.list-foot { padding: var(--space-3) var(--space-5) var(--space-4); border-top: 1px solid var(--color-border); }
.activity-icon { display: grid; place-items: center; width: 40px; height: 40px; border-radius: var(--radius-full); flex-shrink: 0; background: var(--color-sunken); color: var(--color-muted); }
.activity-icon svg { width: 18px; height: 18px; }
.act-income { background: var(--color-success-bg); color: var(--color-success); }
.act-bill_paid { background: var(--color-accent-soft); color: var(--color-accent); }
.act-waitlist_bought { background: var(--color-plum-soft); color: var(--color-plum); }
.list-amount.is-income { color: var(--color-success); }
.activity-empty { padding: 0 var(--space-5) var(--space-5); }

@media (max-width: 759px) {
  .hero { padding: var(--space-5) var(--space-4); }
  .hero-sub { font-size: var(--text-base); }
  .hero-meta { gap: var(--space-2); }
  .meta-btn { padding: var(--space-2) var(--space-3); column-gap: var(--space-2); }
  .list-foot { padding: var(--space-3) var(--space-4); }
  .activity-empty { padding: 0 var(--space-4) var(--space-4); }
}
@media (max-width: 340px) {
  .quick-row { grid-template-columns: 1fr; }
}


/* Bills / Debt / Savings / Wait List / Settings. */

/* Shared page grid: summary stats, an "add" form, and the list.
   Phone/tablet: stats → form → list. Desktop: list on the left, form on the
   right, both under the stats. */
.page-grid {
  display: grid; gap: var(--space-4); align-items: start;
  grid-template-columns: minmax(0, 1fr);
  grid-template-areas: "summary" "form" "list";
}
/* Phones: once there's something in the list, it leads (that's what a returning
   user came to see); while it's empty, the add form leads (setup). */
@media (max-width: 1099px) {
  .page-grid.has-items { grid-template-areas: "summary" "list" "form"; }
}
.g-summary { grid-area: summary; }
.g-form { grid-area: form; }
.g-list { grid-area: list; min-width: 0; }
@media (min-width: 1100px) {
  .page-grid {
    gap: var(--space-5);
    grid-template-columns: minmax(0, 1.55fr) minmax(320px, 1fr);
    grid-template-areas: "summary summary" "list form";
  }
  .g-form { position: sticky; top: var(--space-5); }
}
.section-title { font-size: var(--text-base); color: var(--color-muted); margin: 0 0 var(--space-3); }
.stats .stat-value { overflow-wrap: anywhere; }
@media (max-width: 759px) {
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-2); }
  .stat { padding: var(--space-3); }
  .stat-label { font-size: var(--text-xs); }
  .stat-value { font-size: var(--text-lg); }
}

/* ---------- Bills ---------- */
.bills-list { padding-bottom: var(--space-2); }
.bill-group + .bill-group { border-top: 1px solid var(--color-border); }
.group-title {
  display: flex; align-items: center; gap: var(--space-2);
  padding: var(--space-4) var(--space-5) var(--space-1);
  font-family: var(--font-body); font-size: var(--text-xs); font-weight: var(--weight-bold);
  text-transform: uppercase; letter-spacing: .06em; color: var(--color-muted);
}
.is-overdue .group-title { color: var(--color-danger); }
.group-count { padding: 0 7px; border-radius: var(--radius-full); background: var(--color-sunken); color: var(--color-muted); }
.bill-row.is-paid .list-title, .bill-row.is-paid .list-amount { color: var(--color-muted); }
.bill-row.is-paid .date-chip { opacity: .6; }
.every-n { align-items: end; }
@media (max-width: 759px) {
  .group-title { padding: var(--space-4) var(--space-4) var(--space-1); }
  .bill-row { flex-wrap: wrap; row-gap: var(--space-1); }
  .bill-row .list-main { flex-basis: calc(100% - 46px - var(--space-3)); }
  .bill-row .list-amount { order: 3; margin-left: calc(46px + var(--space-3)); flex: 1; text-align: left; }
  .bill-row .list-actions { order: 4; }
}

/* ---------- Debt ---------- */
.strategy { display: grid; gap: var(--space-2); margin-bottom: var(--space-4); }
.strategy .segmented { display: flex; }
.debt-list { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-2); }
.debt-row {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: start; column-gap: var(--space-3);
  padding: var(--space-3); border-radius: var(--radius-md); border: 1px solid var(--color-border);
}
.debt-row .list-amount { padding-top: 2px; }
.debt-row .icon-btn { margin: -6px -6px 0 0; }
.debt-row.is-focus { border: 1.5px solid var(--color-accent); background: var(--color-accent-soft); }
.debt-row.is-done { background: var(--color-sunken); }
.debt-row.is-done .list-title, .debt-row.is-done .debt-balance { color: var(--color-muted); }
.debt-rank {
  display: grid; place-items: center; width: 32px; height: 32px; flex-shrink: 0; border-radius: var(--radius-full);
  background: var(--color-sunken); font-weight: var(--weight-bold); font-size: var(--text-sm); color: var(--color-muted);
}
.debt-rank svg { width: 16px; height: 16px; }
.is-focus .debt-rank { background: var(--color-primary); color: var(--color-on-primary); }
.is-done .debt-rank { background: var(--color-success-bg); color: var(--color-success); }
.focus-label { grid-column: 1 / -1; display: flex; align-items: center; gap: 4px; font-size: var(--text-xs); font-weight: var(--weight-bold); color: var(--color-primary); text-transform: uppercase; letter-spacing: .05em; margin-bottom: var(--space-2); }
:root[data-theme="dark"] .focus-label { color: var(--color-accent); }
.focus-label svg { width: 14px; height: 14px; }
.debt-link { grid-column: 2 / -1; margin-top: var(--space-2); }
.debt-balance { font-size: var(--text-lg); }

/* ---------- Savings ---------- */
.goal-grid { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-3); grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.goal-card { display: grid; gap: var(--space-2); align-content: start; padding: var(--space-4); }
.goal-top { display: flex; align-items: center; justify-content: space-between; margin: -6px -6px 0 0; }
.goal-name { font-size: var(--text-lg); overflow-wrap: anywhere; }
.goal-amounts { display: flex; align-items: baseline; gap: var(--space-2); flex-wrap: wrap; }
.goal-saved { font-family: var(--font-heading); font-size: var(--text-2xl); font-weight: var(--weight-bold); }
.goal-pct { margin-top: var(--space-2); }
.goal-done { color: var(--color-success); font-weight: var(--weight-bold); }
.goal-actions { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-top: var(--space-2); }
.goal-actions .btn { flex: 1; }

/* ---------- Wait List ---------- */
.wait-grid { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-3); }
.wait-card { display: grid; gap: var(--space-3); padding: var(--space-4) var(--space-5); }
.wait-card.is-ready { border: 1.5px solid var(--color-cat-safe); }
.wait-head { display: flex; gap: var(--space-3); align-items: flex-start; }
.wait-head h3 { font-family: var(--font-body); font-size: var(--text-base); }
.wait-price { font-size: var(--text-lg); }
.wait-timer { display: grid; grid-template-columns: 1fr auto; gap: var(--space-3); align-items: center; }
.wait-progress > span { background: var(--color-cat-setaside); }
.wait-remaining { font-size: var(--text-sm); font-weight: var(--weight-bold); white-space: nowrap; }
.is-ready .wait-remaining { color: var(--color-success); }
.wait-question { font-weight: var(--weight-semibold); }
.wait-question .muted { font-weight: var(--weight-regular); }
.wait-card .goal-actions { margin-top: 0; }
.wait-card .goal-actions .btn { flex: 0 1 auto; }
.how-steps { list-style: none; counter-reset: how; margin: 0; padding: 0; display: grid; gap: var(--space-3); }
.how-steps li { counter-increment: how; display: grid; grid-template-columns: 28px 1fr; column-gap: var(--space-3); font-size: var(--text-sm); }
.how-steps li::before {
  content: counter(how); grid-row: span 2; display: grid; place-items: center; width: 28px; height: 28px; border-radius: var(--radius-full);
  background: var(--color-plum-soft); color: var(--color-plum); font-weight: var(--weight-bold);
}
.how-steps span { color: var(--color-muted); }
.history > summary { padding: 0 var(--space-5); }
.history .list-item { padding-left: var(--space-5); }
@media (max-width: 759px) {
  .wait-card { padding: var(--space-4); }
  .history > summary, .history .list-item { padding-left: var(--space-4); }
}

/* ---------- Settings ---------- */
.settings-grid { display: grid; gap: var(--space-4); max-width: 760px; }
.settings-head { margin-bottom: var(--space-4); }
.settings-head p { margin-top: var(--space-1); }
.settings-section .segmented { display: flex; max-width: 420px; }
.settings-section .field .select { max-width: 420px; }
.facts { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-3); font-size: var(--text-sm); }
.facts li { display: flex; gap: var(--space-3); align-items: flex-start; }
.facts .icon { color: var(--color-accent); margin-top: 1px; }
.facts svg { width: 18px; height: 18px; }
.facts span { color: var(--color-muted); }
.facts strong { color: var(--color-ink); }
.danger-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; }
.version { text-align: center; padding: var(--space-2) 0; }

</style>

<script>
window.APP_DEMO_MODE = false;

/* Hash router + nav. Each view module registers
 *   App.views[id] = { navLabel, icon, title, render(root), badge?(state) }
 * and pushes its id onto App.nav in display order.
 *
 * Contract relied on by validators/app_check.py: #view-nav holds one
 * [data-nav="<id>"] button per view, and showing a view sets
 * #view-root[data-active-view] and replaces its content entirely.
 *
 * The current view re-renders whenever the store changes, keeping scroll
 * position and (by element id) keyboard focus, so a submitted form stays ready
 * for the next entry. */
(function (g) {
  var App = g.App || (g.App = { views: {}, nav: [] });
  var current = null;
  var rendered = null; // id of the view whose DOM is currently mounted

  function root() { return document.getElementById('view-root'); }

  function render(opts) {
    var view = App.views[current];
    var el = root();
    var active = document.activeElement;
    var focusId = active && active.id && el.contains(active) ? active.id : null;
    var scrollY = window.scrollY;

/* Boot: build the store from storage, wire the shell (brand, demo banner, theme,
 * backup), then start the router. Runs last — after every module has registered.
 *
 * The full and demo builds differ ONLY by window.APP_DEMO_MODE (set by
 * tools/app_bundle.js): the demo uses its own storage key and caps bills at 3. */
(function (g) {
  var App = g.App;
  var C = App.core;
  var ui = App.ui;
  var h = ui.h;
  var DEMO = !!g.APP_DEMO_MODE;

  App.config = {
    title: 'Safe to Spend',
    tagline: 'ADHD Budget Planner',
    demo: DEMO,
    storageKey: DEMO ? 'adhd-safe-to-spend-demo:v1' : 'adhd-safe-to-spend:v1',
    limits: DEMO ? { maxBills: 3 } : {},
    version: '2.0.0',
  };

  /* ---------- storage + store ---------- */
  var storageProblem = null;
  var storage = C.createStorage({
    key: App.config.storageKey,
    onProblem: function (kind) {
      if (kind === 'quota') ui.toast('Couldn’t save — this browser’s storage is full. Export a backup from Settings.');
      if (kind === 'nearQuota') ui.toast('Storage is nearly full. Export a backup from Settings.');
    },
  });
  var loaded = storage.load();
  storageProblem = loaded.problem;

  App.store = C.createStore({ state: loaded.state, actions: C.actions, storage: storage, limits: App.config.limits });
  App.storage = storage;

  App.bootProblem = function () {
    if (!storageProblem) return null;
    var msg = {
      unavailable: ['Saving is turned off in this browser', 'Your entries will disappear when you close this tab. Private-browsing mode often causes this — open the app in a normal window.'],
      corrupt: ['We couldn’t read your saved data', 'A copy was kept safely on this device and the app started fresh. If you have a backup file, restore it from Settings.'],
      newer: ['This data was saved by a newer version', 'A copy was kept safely. Reload the page to get the latest version of the app.'],
      partial: ['Some saved items couldn’t be read', 'Everything readable was loaded; the original was kept as a copy on this device.'],
    }[storageProblem];
    return h('div', { class: 'banner ' + (storageProblem === 'partial' ? 'warning' : 'error'), attrs: { role: 'alert' } }, ui.icon('alert'),
      h('div', null, h('strong', { text: msg[0] }), msg[1], ' ',
        h('button', { type: 'button', class: 'link-btn', text: 'Dismiss', on: { click: function () { storageProblem = null; App.router.refresh(); } } })));
  };

  // Paid bills whose date has passed move to their next cycle — at boot, and
  // whenever the app comes back to the foreground on a new day.
  var lastRollDay = null;
  function rollIfNewDay() {
    var today = App.store.today();
    if (today === lastRollDay) return;
    lastRollDay = today;
    var before = JSON.stringify(App.store.getState().bills);
    var after = App.store.getState().bills.map(function (b) { return C.bills.rollForward(b, today); });
    if (JSON.stringify(after) !== before) App.store.dispatch('rollBills');
    else if (App.router.current()) App.router.refresh();
  }

  /* ---------- theme ---------- */
  var mql = g.matchMedia ? g.matchMedia('(prefers-color-scheme: dark)') : null;
  function applyTheme() {
    var pref = App.store.getState().settings.theme;
    var resolved = pref === 'system' ? (mql && mql.matches ? 'dark' : 'light') : pref;
    document.documentElement.setAttribute('data-theme', resolved);
  }
  if (mql && mql.addEventListener) mql.addEventListener('change', applyTheme);
  App.store.subscribe(applyTheme);
  applyTheme();

  /* ---------- backup ---------- */
  App.backup = {
    exportFile: function () {
      var state = App.store.getState();
      var payload = Object.assign({ app: 'adhd-safe-to-spend', exportedAt: new Date().toISOString() }, state);
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'safe-to-spend-backup-' + App.store.today() + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      App.store.dispatch('markBackedUp');
    },
    /** Reads a File -> Promise<{state, report}> ; rejects with a user-facing message. */
    readFile: function (file) {
      return new Promise(function (resolve, reject) {
        if (!file) return reject(new Error('No file chosen.'));
        if (file.size > 5 * 1024 * 1024) return reject(new Error('That file is too large to be a backup from this app.'));
        var r = new FileReader();
        r.onerror = function () { reject(new Error('That file couldn’t be read.')); };
        r.onload = function () {
          var parsed;
          try { parsed = JSON.parse(r.result); } catch (e) { return reject(new Error('That file isn’t a backup from this app (it isn’t valid JSON).')); }

            reject(new Error(e.message === 'newer'

        r.readAsText(file);
      });
    },
  };

  // Example numbers for the public demo only, clearly labelled as examples.
  App.loadSampleData = function () {
    var t = App.store.today();
    var d = C.dates;
    var st = App.store;
    st.dispatch('setBalance', { amount: '2140' });
    st.dispatch('setPayday', { next: d.addDays(t, 9), cadence: 'biweekly' });
    st.dispatch('addBill', { name: 'Rent', amount: '1150', dueDate: d.addDays(t, 4), cadence: 'monthly' });
    st.dispatch('addBill', { name: 'Phone', amount: '45', dueDate: d.addDays(t, -1), cadence: 'monthly' });
    st.dispatch('addBill', { name: 'Car insurance', amount: '540', dueDate: d.addMonths(t, 3), cadence: 'every_n_months', everyN: '6', setAside: true });
    var card = st.dispatch('addDebt', { name: 'Credit card', balance: '1860', apr: '24.99', minPayment: '55' });
    st.dispatch('addDebt', { name: 'Store card', balance: '420', apr: '29.9', minPayment: '25' });
    st.dispatch('addDebt', { name: 'Car loan', balance: '6200', apr: '7.4', minPayment: '210' });
    st.dispatch('addGoal', { name: 'Emergency fund', kind: 'goal', target: '1000', saved: '150' });
    st.dispatch('addGoal', { name: 'Birthday gifts', kind: 'envelope', saved: '40' });
    st.dispatch('addWait', { name: 'Noise-cancelling headphones', price: '179' });
    st.dispatch('logActivity', { kind: 'spend', amount: '23.40', label: 'Groceries' });
    st.dispatch('dismissOnboarding');
    void card;
    ui.toast('Example numbers loaded — try changing them');
  };

  /* ---------- shell ---------- */
  function brand() {
    return [ui.brandMark(), h('span', { class: 'brand-name' }, App.config.title, h('small', { text: App.config.tagline }))];
  }
  document.getElementById('sidebarBrand').replaceChildren.apply(document.getElementById('sidebarBrand'), brand());
  var top = document.getElementById('topbar');
  top.appendChild(h('div', { class: 'brand' }, brand()));
  document.getElementById('sidebarFoot').appendChild(h('div', { class: 'privacy' }, ui.icon('lock'),
    h('span', { text: 'Private by design: your numbers stay in this browser. No bank login, no account.' })));

  if (DEMO) {
    var banner = document.getElementById('demoBanner');

    banner.appendChild(h('span', { text: 'You’re trying the free demo — up to 3 bills. The full version has no limits.' }));
  }

  g.addEventListener('pagehide', function () { storage.flush(); });
  document.addEventListener('visibilitychange', function () {

  });

  rollIfNewDay();
