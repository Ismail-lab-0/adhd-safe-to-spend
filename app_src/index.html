<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FBF6F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D161C" media="(prefers-color-scheme: dark)">
<meta name="description" content="Know what's safe to spend until payday — after bills, set-asides and savings. Private, offline, no bank login.">
<title>__TITLE__</title>
<script>
  /* Apply the saved theme before first paint so dark-mode users never see a white flash. */
  (function () {
    try {
      var keys = ['adhd-safe-to-spend:v1', 'adhd-safe-to-spend-demo:v1'];
      var t = 'system';
      for (var i = 0; i < keys.length; i++) {
        var raw = localStorage.getItem(keys[i]);
        if (raw) { t = (JSON.parse(raw).settings || {}).theme || 'system'; break; }
      }
      if (t === 'system') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* defaults to light */ }
  })();
</script>
<!--STYLES-->
</head>
<body>
<div class="shell" id="app">
  <aside class="sidebar" aria-label="Main">
    <div class="brand" id="sidebarBrand"></div>
    <nav id="view-nav" aria-label="Main navigation"></nav>
    <div class="sidebar-foot" id="sidebarFoot"></div>
  </aside>
  <div class="main">
    <div class="demo-banner" id="demoBanner" hidden></div>
    <header class="topbar" id="topbar"></header>
    <main id="view-root" tabindex="-1" data-active-view=""></main>
  </div>
</div>
<div class="toast-region" id="toast-region" aria-live="polite"></div>
<noscript><p style="padding:24px;font-family:sans-serif">This app needs JavaScript turned on to work.</p></noscript>
<!--SCRIPTS-->
</body>
</html>
